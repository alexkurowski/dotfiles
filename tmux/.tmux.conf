unbind C-b
# MacOS
set -g prefix '`'
bind '`' send-prefix
# Poker 2
# set -g prefix '`'
# bind '`' send-prefix

bind p choose-session
bind s split-window -v -c '#{pane_current_path}'
bind v split-window -h -c '#{pane_current_path}'
bind n new-window -c '#{pane_current_path}'

bind x kill-pane
bind X kill-window
bind C-x kill-session

bind < swap-window -t -1\; select-window -t -1
bind > swap-window -t +1\; select-window -t +1

bind . next
bind , prev

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind ] set -g status

setw -g mode-keys vi
set -sg escape-time 0

# set -g mouse-utf8 on
set -g mouse on

set -g base-index 1
set -g renumber-windows on

set -g pane-border-style fg=colour8,bg=colour0
set -g pane-active-border-style fg=colour7,bg=colour0

set-window-option -g message-style fg=colour0,bg=white
set-window-option -g mode-style fg=colour0,bg=white
set-window-option -g window-status-bell-style fg=colour0,bg=colour2
set-window-option -g window-status-current-style fg=colour2
set-window-option -g automatic-rename on

set -g status-style fg=white,bg=colour0
set -g status-justify right
set -g status-left-length 30

set -g visual-bell off
set -g visual-activity on
set -g status-position top
set -g default-terminal "$TERM"
set -ag terminal-overrides ",$TERM:Tc"
set -g default-shell /bin/zsh
set -g history-limit 5000
# set -g default-command 'reattach-to-user-namespace -l zsh'

set -g status-left '  #[fg=blue,bold]#S #[default]'
set -g status-right ''
# set -g status-right ' #[fg=magenta,bold]#(~/bin/battery.sh)  #[fg=cyan]%H:%M  #[default]'
